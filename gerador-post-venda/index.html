<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Post "Vendido!" — Praia Digital</title>
<meta name="description" content="Transforme cada venda em marketing: post de "vendido" que gera autoridade e novos clientes.">
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
  body{background:#f0f9ff;color:#0f172a;min-height:100vh}
  header{background:linear-gradient(135deg,#0077B6,#00B4D8);color:#fff;padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
  header a{color:#fff;text-decoration:none;font-weight:700}.logo{font-size:1.2rem}
  main{max-width:660px;margin:2rem auto;padding:0 1rem}
  .card{background:#fff;border-radius:16px;padding:1.75rem;box-shadow:0 4px 24px rgba(0,60,100,.08)}
  h1{font-size:1.5rem;color:#0077B6}.sub{color:#64748b;margin:.3rem 0 1.2rem;font-size:.95rem}
  label{display:block;font-weight:600;font-size:.85rem;margin:.9rem 0 .3rem}
  input,select{width:100%;padding:.7rem;border:1px solid #cbd5e1;border-radius:10px;font-size:1rem}
  button{width:100%;margin-top:1.3rem;padding:.9rem;border:0;border-radius:12px;background:#0077B6;color:#fff;font-weight:800;font-size:1rem;cursor:pointer}
  #out{display:none;margin-top:1.2rem;background:#f8fafc;border:1px solid #cbd5e1;border-radius:12px;padding:1.25rem;white-space:pre-wrap;font-size:.92rem;line-height:1.7}
  .copy{margin-top:.75rem;padding:.6rem 1rem;border:1px solid #0077B6;background:#fff;color:#0077B6;border-radius:10px;font-weight:700;cursor:pointer;display:none}
  .dica{margin-top:1rem;background:#ecfeff;border:1px solid #67e8f9;border-radius:12px;padding:1rem;font-size:.9rem}
</style>
</head>
<body>
<header>
  <a class="logo" href="https://praia.digital/">🏖️ Praia Digital</a>
  <a href="https://praia.digital/portal-corretores">← Portal do Corretor</a>
</header>
<main>
  <div class="card">
    <h1>🎉 Post "Vendido!"</h1>
    <p class="sub">Prova social é o marketing mais barato do corretor. Gere seu post:</p>
    <label>Tipo de imóvel vendido</label>
    <select id="tipo"><option>Apartamento 2 dormitórios</option><option>Casa com quintal</option><option>Cobertura</option><option>Studio</option><option>Terreno</option></select>
    <label>Bairro/cidade</label><input id="local" value="Enseada, Guarujá">
    <label>Tempo até vender</label>
    <select id="tempo"><option>menos de 2 semanas</option><option>1 mês</option><option>3 meses</option></select>
    <label>Seu nome</label><input id="nome" value="Ana Lima">
    <button onclick="gerar()">Gerar post</button>
    <div id="out"></div>
    <button class="copy" id="cp" onclick="navigator.clipboard.writeText(document.getElementById('out').textContent);this.textContent='✅ Copiado!'">📋 Copiar post</button>
    <div class="dica">📸 Legenda alternativa no <a href="https://praia.digital/blog-litoral/gerador-instagram/" style="color:#0077B6;font-weight:700">Gerador de Legendas</a> · 🎯 <a href="https://praia.digital/portal-corretores/planejador-metas/" style="color:#0077B6;font-weight:700">Planejador de Metas</a></div>
  </div>
</main>
<script>
function gerar(){
  var t=document.getElementById('tipo').value, l=document.getElementById('local').value;
  var tp=document.getElementById('tempo').value, n=document.getElementById('nome').value;
  var txt='🎉 VENDIDO!\n\nMais uma família realizando o sonho do imóvel no litoral!\n\n🏠 '+t+'\n📍 '+l+'\n⚡ Vendido em '+tp+'\n\nCada venda dessas começa com uma conversa. Se você está pensando em comprar, vender ou investir no litoral, me chama — a primeira conversa é gratuita e sem compromisso.\n\n📲 Link na bio.\n\n— '+n+'\n\n#vendido #imoveisnolitoral #'+l.split(',')[0].replace(/\s/g,'').toLowerCase()+' #corretordeimoveis #praiadigital';
  document.getElementById('out').textContent=txt;
  document.getElementById('out').style.display='block';
  document.getElementById('cp').style.display='inline-block';
}
</script>
</body>
</html>
